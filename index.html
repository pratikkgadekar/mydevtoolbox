<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDevToolbox — Fast, Free & Privacy-First Browser Utilities</title>
  <meta name="description" content="Free 100% client-side web toolbox: PDF merger, JSON studio, QR generator, image compressor, code diff, regex, and cryptographic tools." />
  
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2884422236657572"
     crossorigin="anonymous"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/diff-match-patch/1.0.5/index.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    /* 3-Theme Variable Definitions */
    :root[data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-editor: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --card-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.05);
    }
    :root[data-theme="dim"] {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.9);
      --bg-editor: #090e1a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    :root[data-theme="dark"] {
      --bg-main: #05070d;
      --bg-card: rgba(13, 17, 28, 0.95);
      --bg-editor: #080b12;
      --border-color: #1f293d;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --accent: #818cf8;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(12px);
    }
    .theme-editor {
      background-color: var(--bg-editor);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    /* JSON Syntax Colors */
    .json-key { color: #f43f5e; font-weight: 600; }
    .json-string { color: #10b981; }
    .json-number { color: #f59e0b; }
    .json-boolean { color: #8b5cf6; font-weight: 600; }
    .json-null { color: #64748b; font-style: italic; }

    /* Code Diff Colors */
    .diff-insert { background-color: rgba(16, 185, 129, 0.25); color: #10b981; }
    .diff-delete { background-color: rgba(244, 63, 94, 0.25); color: #f43f5e; text-decoration: line-through; }

    /* Kawaii Pet Bouncy Fluid Animations */
    @keyframes pet-bounce {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      30% { transform: scale(1.12, 0.88) translateY(3px); }
      50% { transform: scale(0.92, 1.1) translateY(-8px); }
      70% { transform: scale(1.05, 0.95) translateY(0); }
    }
    .animate-pet { animation: pet-bounce 2.8s infinite ease-in-out; }

    @keyframes eye-blink-smooth {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.12); }
    }
    .eye-blink-smooth { animation: eye-blink-smooth 3.6s infinite; transform-origin: center; }
  </style>
</head>

<body class="min-h-screen flex flex-col font-sans antialiased relative selection:bg-indigo-500 selection:text-white">

  <header class="border-b theme-card sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('dashboard')">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="font-extrabold text-lg tracking-tight">MyDev<span class="text-indigo-500">Toolbox</span></span>
          <span class="text-[10px] ml-2 px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 font-bold">100% Client-Side</span>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="switchView('dashboard')" class="text-xs font-bold px-3 py-1.5 rounded-xl hover:bg-slate-500/10 transition">Dashboard</button>

        <div class="flex items-center p-1 rounded-2xl border theme-card gap-1 text-xs">
          <button onclick="setTheme('light')" id="btn-theme-light" class="p-1.5 rounded-xl transition" title="Light"><i data-lucide="sun" class="w-4 h-4"></i></button>
          <button onclick="setTheme('dim')" id="btn-theme-dim" class="p-1.5 rounded-xl transition" title="Midnight"><i data-lucide="moon-star" class="w-4 h-4"></i></button>
          <button onclick="setTheme('dark')" id="btn-theme-dark" class="p-1.5 rounded-xl transition" title="Dark"><i data-lucide="moon" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full">
    <div class="w-full h-16 sm:h-20 theme-card border border-dashed rounded-2xl flex items-center justify-center text-xs opacity-50 tracking-wider uppercase font-semibold">
      <span>Ad Space — 728x90 Leaderboard</span>
    </div>
  </div>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

    <div id="view-dashboard">
      <div class="text-center max-w-2xl mx-auto mb-10 pt-2">
        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-500 text-xs font-bold mb-3">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 100% In-Browser • Zero Tracking • Zero Latency
        </div>
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
          Every Web Tool You Need, <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">In One Place</span>.
        </h1>
        <p class="mt-2 text-sm sm:text-base opacity-70">
          Fast, free micro-utilities running purely in your browser memory.
        </p>

        <div class="mt-6 relative max-w-xl mx-auto flex items-center">
          <i data-lucide="search" class="w-5 h-5 absolute left-4 text-slate-400"></i>
          <input 
            type="text" 
            id="tool-search" 
            oninput="filterTools()" 
            onkeydown="if(event.key === 'Enter') handleMainSearchEnter()" 
            placeholder="Search any tool (e.g. JSON, PDF, QR, Diff, Hash, Case, Password, UUID)..." 
            class="w-full pl-12 pr-24 py-3.5 theme-editor border rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-md transition"
          />
          <button 
            onclick="filterTools()" 
            class="absolute right-2 px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow transition">
            Search
          </button>
        </div>
        
        <div id="search-status-text" class="text-xs font-semibold text-indigo-500 mt-2.5 hidden"></div>

        <div class="flex flex-wrap items-center justify-center gap-2 mt-5 text-xs">
          <button onclick="setCategoryFilter('all')" class="cat-pill active px-4 py-1.5 rounded-xl bg-indigo-600 text-white font-bold shadow-md shadow-indigo-500/20 transition">All Tools</button>
          <button onclick="setCategoryFilter('popular')" class="cat-pill px-4 py-1.5 rounded-xl theme-card font-semibold border hover:border-indigo-500 transition">🔥 Most Popular (12)</button>
          <button onclick="setCategoryFilter('general')" class="cat-pill px-4 py-1.5 rounded-xl theme-card font-semibold border hover:border-indigo-500 transition">Everyday Utilities (12)</button>
          <button onclick="setCategoryFilter('format')" class="cat-pill px-4 py-1.5 rounded-xl theme-card font-semibold border hover:border-indigo-500 transition">JSON & Data Studio (12)</button>
          <button onclick="setCategoryFilter('generator')" class="cat-pill px-4 py-1.5 rounded-xl theme-card font-semibold border hover:border-indigo-500 transition">Security & Generators (12)</button>
          <button onclick="setCategoryFilter('dev')" class="cat-pill px-4 py-1.5 rounded-xl theme-card font-semibold border hover:border-indigo-500 transition">Developer & Web (12)</button>
        </div>
      </div>

      <div id="tools-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <div class="tool-card theme-card border p-6 rounded-3xl cursor-pointer transition-all duration-200 hover:-translate-y-1.5 flex flex-col justify-between" data-cat="general popular" onclick="openTool('pdf-toolkit')">
          <div>
            <div class="flex items-start justify-between">
              <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-500">
                <i data-lucide="file-stack" class="w-6 h-6"></i>
              </div>
              <span class="text-[11px] font-bold uppercase bg-rose-500/10 text-rose-500 border border-rose-500/20 px-2.5 py-0.5 rounded-full">Top Ranked</span>
            </div>
            <h3 class="font-bold text-base
