<!-- ================= KAWAII BLOBBY (HIGH-CONTRAST + SMART TOOL SEARCH) ================= -->
  <div id="companion-container" class="fixed z-50 bottom-4 right-6 flex flex-col items-end select-none transition-all duration-1000 ease-out">
    
    <!-- Mini Game, Smart Search & Dialog Modal -->
    <div id="companion-dialog" class="hidden w-80 sm:w-88 theme-card border border-indigo-500/30 shadow-2xl rounded-3xl p-5 text-xs space-y-3.5 mb-2">
      <div class="flex items-center justify-between border-b border-slate-500/20 pb-2.5">
        <span class="font-extrabold text-pink-500 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-pink-500 animate-ping"></span> Blobby Assistant ✨
        </span>
        <button onclick="toggleCompanionDialog()" class="opacity-50 hover:opacity-100 font-bold text-base leading-none">&times;</button>
      </div>

      <!-- Smart Natural Language / Keyword Search Box -->
      <div class="space-y-1.5">
        <label class="block text-[11px] font-bold opacity-80">Ask Blobby or Search a Tool:</label>
        <div class="relative">
          <input 
            type="text" 
            id="blobby-search-input" 
            onkeydown="if(event.key==='Enter') executeBlobbySearch()"
            placeholder="e.g. merge pdfs, format json, make qr..." 
            class="w-full pl-8 pr-16 py-2.5 theme-editor border rounded-xl text-xs focus:ring-2 focus:ring-pink-500 focus:outline-none shadow-sm"
          />
          <i data-lucide="sparkles" class="w-4 h-4 absolute left-2.5 top-2.5 text-pink-500"></i>
          <button onclick="executeBlobbySearch()" class="absolute right-1.5 top-1.5 px-2.5 py-1 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-lg text-[10px] transition">
            Go
          </button>
        </div>
        <p id="blobby-search-feedback" class="text-[10px] text-pink-500 font-semibold hidden"></p>
      </div>

      <!-- Quick Action Area & Mini-Game -->
      <div class="space-y-2.5 pt-2 border-t border-slate-500/20">
        <p id="blobby-msg" class="leading-relaxed opacity-90 font-medium">What would you like to build or convert today?</p>
        
        <div id="reflex-box" class="hidden p-3.5 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-center cursor-pointer" onclick="handleReflexClick()">
          <span id="reflex-text" class="font-bold text-indigo-500">Wait for green...</span>
        </div>

        <div class="flex gap-2 pt-1">
          <button onclick="startReflexGame()" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-sm transition text-center">Reflex Game</button>
          <button onclick="tellDevJoke()" class="flex-1 py-1.5 theme-card border font-bold rounded-xl hover:border-pink-500 transition text-center">Dev Joke</button>
        </div>
      </div>
    </div>

    <!-- High-Contrast Kawaii Bouncy Blobby Character Button -->
    <div onclick="toggleCompanionDialog()" class="cursor-pointer group flex items-center gap-2.5 bg-white/95 dark:bg-slate-900/95 border-2 border-pink-400/50 rounded-full pl-3.5 pr-1.5 py-1.5 shadow-xl backdrop-blur-md transition-all hover:scale-110 active:scale-95">
      <span class="text-[11px] font-extrabold text-pink-600 dark:text-pink-400">Ask Blobby ✨</span>
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-rose-400 via-pink-500 to-indigo-500 p-0.5 flex items-center justify-center animate-kawaii shadow-inner">
        <svg width="32" height="32" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="blobbyHighContrast" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffedd5"/>
              <stop offset="40%" stop-color="#f43f5e"/>
              <stop offset="100%" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
          <!-- Squishy Body Base -->
          <path d="M50 14 C78 14 92 32 92 58 C92 84 76 92 50 92 C24 92 8 84 8 58 C8 32 22 14 50 14 Z" fill="url(#blobbyHighContrast)" stroke="#4c0519" stroke-width="2.5"/>
          
          <!-- Cute Rosy Blush -->
          <ellipse cx="24" cy="62" rx="7" ry="4" fill="#fda4af" opacity="0.95"/>
          <ellipse cx="76" cy="62" rx="7" ry="4" fill="#fda4af" opacity="0.95"/>
          
          <!-- High-Contrast Big Expressive Anime Eyes -->
          <g class="eye-sparkle">
            <!-- Left Eye -->
            <ellipse cx="34" cy="46" rx="6.5" ry="8.5" fill="#0f172a"/>
            <circle cx="36" cy="43" r="3" fill="#ffffff"/>
            <circle cx="32" cy="49" r="1.5" fill="#ffffff"/>
            
            <!-- Right Eye -->
            <ellipse cx="66" cy="46" rx="6.5" ry="8.5" fill="#0f172a"/>
            <circle cx="64" cy="43" r="3" fill="#ffffff"/>
            <circle cx="68" cy="49" r="1.5" fill="#ffffff"/>
          </g>
          
          <!-- Defined Happy Mouth -->
          <path d="M43 60 Q 50 68 57 60" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>
  </div>
